# Models evaluated for the leaderboard.
#
# Every model here is served through an OpenAI-compatible server and evaluated
# with `--backend openai`, so adding a model means adding an entry, not code.
#
#   id          Hugging Face repo ID, or the API model ID when source = "api"
#   source      "vllm" (served with `vllm serve`) or "api"
#   status      "active"  evaluated by `eval-mm run-model --all`
#               "pending" listed, but serving is not verified yet
#   gpus        tensor parallel size passed to `vllm serve`
#   thinking    "on" / "off" for models whose chat template has a thinking
#               switch; omit to keep the model default
#   serve_args  extra arguments for `vllm serve`
#   note        why an entry is pending, or anything a runner must know

