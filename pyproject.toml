[project]
name = "eval-mm"
description = "eval-mm is a tool for evaluating Multi-Modal Large Language Models."
authors = [
    { name = "Silviase", email = "koki.maeda@nlp.c.titech.ac.jp" },
    { name = "speed1313", email = "sugiura.issa.q29@kyoto-u.jp" },
]
dependencies = [
    "setuptools",
    "psutil",
    "datasets>=2.21.0",
    "pyarrow>=14.0.0",
    "requests>=2.32.3",
    "python-dotenv>=1.0.1",
    "openai>=1.42.0",
    "rouge-score>=0.1.2",
    "emoji>=2.12.1",
    "fugashi>=1.3.2",
    "unidic-lite>=1.0.8",
    "sacrebleu[ja]>=2.4.3",
    "backoff>=2.2.1",
    "scipy>=1.15.1",
    "webdataset>=0.2.111",
    "av>=14.1.0",
    "loguru>=0.7.3",
    "types-requests>=2.32.0.20250328",
    "japanize-matplotlib>=1.1.3",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">= 3.12.1"

dynamic = ["version"]

[project.scripts]
eval-mm = "eval_mm.cli:main"

[project.urls]
Repository = "https://github.com/llm-jp/llm-jp-eval-mm"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/eval_mm/_version.py"

[tool.hatch.build]
exclude = ["result", "scripts"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pre-commit>=4.2.0",
    "pytest>=8.3.4",
    "seaborn>=0.13.2",
    "streamlit>=1.43.2",
]

vllm_normal = [
    "torchvision",
    "torch>=2.8.0",
    "accelerate>=1.2.1",
    "qwen-vl-utils>=0.0.8",
    "sentencepiece>=0.2.0",
    "timm>=1.0.13",
    "transformers>=4.57.0",
    "vllm>=0.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eval_mm"]
artifacts = ["*.png"]
